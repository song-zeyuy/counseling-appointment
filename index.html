<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心理咨询预约系统</title>
  <style>
    :root {
      --primary: #6C8EBF;
      --primary-dark: #4A6FA5;
      --primary-light: #E8F0FB;
      --accent: #A8C5DA;
      --success: #5B9E7A;
      --warning: #E8A84E;
      --danger: #C96B6B;
      --text: #2D3748;
      --text-light: #718096;
      --border: #CBD5E0;
      --bg: #F7F9FC;
      --white: #FFFFFF;
      --shadow: 0 4px 20px rgba(108,142,191,0.12);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #E8F0FB 0%, #F0F4FA 50%, #EAF3EE 100%);
      min-height: 100vh;
      color: var(--text);
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      text-align: center;
      padding: 36px 20px 28px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -20px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    .header-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* ===== Main Container ===== */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* ===== Card ===== */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* ===== Time Schedule Grid ===== */
    .schedule-section {
      margin-bottom: 0;
    }

    .week-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .schedule-grid {
      min-width: 560px;
      display: grid;
      grid-template-columns: 90px repeat(6, 1fr);
      gap: 4px;
    }

    .schedule-header {
      padding: 10px 6px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--primary-dark);
      background: var(--primary-light);
      border-radius: 8px;
    }

    .time-label {
      padding: 10px 8px;
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      border-radius: 8px;
      font-weight: 500;
    }

    .time-slot {
      padding: 10px 4px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      background: #F8FAFC;
      color: var(--text-light);
      user-select: none;
    }

    .time-slot:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: var(--accent);
    }

    .time-slot.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(108,142,191,0.35);
    }

    .time-slot.booked {
      background: #F0F0F0;
      color: #C0C0C0;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .selected-time-display {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--primary-light);
      border-radius: 8px;
      font-size: 14px;
      color: var(--primary-dark);
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .selected-time-display.empty {
      color: var(--text-light);
    }

    /* ===== Form Fields ===== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .required-mark {
      color: var(--danger);
      margin-left: 2px;
    }

    .optional-mark {
      color: var(--text-light);
      font-size: 12px;
      font-weight: 400;
      margin-left: 4px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      color: var(--text);
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,142,191,0.15);
    }

    .form-input::placeholder {
      color: #B0BAC9;
    }

    .form-textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.6;
    }

    /* ===== Radio & Checkbox Groups ===== */
    .option-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option-item {
      position: relative;
    }

    .option-item input[type="radio"],
    .option-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .option-label {
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-light);
      transition: all 0.2s ease;
      background: white;
      user-select: none;
    }

    .option-label:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
      background: var(--primary-light);
    }

    .option-item input:checked + .option-label {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(108,142,191,0.3);
    }

    /* ===== Submit Button ===== */
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(108,142,191,0.4);
      font-family: inherit;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,142,191,0.5);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== Notice Box ===== */
    .notice-box {
      background: linear-gradient(135deg, #FFF9EC, #FFF3D6);
      border: 1px solid #F5D78E;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #7A5C1E;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .notice-box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    /* ===== Success Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-icon {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
    }

    .modal h2 {
      font-size: 22px;
      color: var(--success);
      margin-bottom: 12px;
    }

    .modal p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .modal-detail {
      background: var(--bg);
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      margin: 16px 0;
      font-size: 13px;
      line-height: 1.9;
      color: var(--text);
    }

    .modal-btn {
      padding: 12px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      font-weight: 600;
    }

    /* ===== Validation ===== */
    .form-input.error,
    .option-group.error {
      border-color: var(--danger);
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    /* ===== Footer ===== */
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      padding: 20px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="header-icon">🌿</span>
  <h1>心理咨询预约</h1>
  <p>温暖陪伴 · 专业支持 · 保密安全</p>
</div>

<!-- Main Content -->
<div class="container">

  <!-- Notice -->
  <div class="notice-box">
    <strong>📋 预约须知</strong>
    请选择您希望预约的时间段，并填写基本信息。预约成功后，咨询师会在 24 小时内与您确认。每次咨询时长为 50 分钟，请准时参加。
  </div>

  <form id="appointmentForm" novalidate>

    <!-- 时间选择 -->
    <div class="card schedule-section">
      <div class="card-title">选择预约时间</div>
      <div class="week-scroll">
        <div class="schedule-grid" id="scheduleGrid">
          <!-- JS 动态生成 -->
        </div>
      </div>
      <div class="selected-time-display empty" id="selectedTimeDisplay">
        📅 请在上方表格中点击选择您希望预约的时间
      </div>
      <div class="error-msg" id="timeError">请选择预约时间</div>
    </div>

    <!-- 基本信息 -->
    <div class="card">
      <div class="card-title">填写预约信息</div>

      <!-- 昵称 -->
      <div class="form-group">
        <label class="form-label" for="nickname">
          昵称 <span class="required-mark">*</span>
        </label>
        <input type="text" id="nickname" class="form-input"
               placeholder="请输入您的昵称（保护隐私）" maxlength="20" />
        <div class="error-msg" id="nicknameError">请填写昵称</div>
      </div>

      <!-- 性别 -->
      <div class="form-group">
        <label class="form-label">
          性别 <span class="required-mark">*</span>
        </label>
        <div class="option-group" id="genderGroup">
          <div class="option-item">
            <input type="radio" name="gender" id="male" value="男" />
            <label class="option-label" for="male">男</label>
          </div>
          <div class="option-item">
            <input type="radio" name="gender" id="female" value="女" />
            <label class="option-label" for="female">女</label>
          </div>
          <div class="option-item">
            <input type="radio" name="gender" id="other" value="其他" />
            <label class="option-label" for="other">其他 / 不便透露</label>
          </div>
        </div>
        <div class="error-msg" id="genderError">请选择性别</div>
      </div>

      <!-- 年龄段 -->
      <div class="form-group">
        <label class="form-label">
          年龄段 <span class="required-mark">*</span>
        </label>
        <div class="option-group" id="ageGroup">
          <div class="option-item">
            <input type="radio" name="age" id="age1" value="18岁以下" />
            <label class="option-label" for="age1">18岁以下</label>
          </div>
          <div class="option-item">
            <input type="radio" name="age" id="age2" value="18-25岁" />
            <label class="option-label" for="age2">18-25岁</label>
          </div>
          <div class="option-item">
            <input type="radio" name="age" id="age3" value="26-35岁" />
            <label class="option-label" for="age3">26-35岁</label>
          </div>
          <div class="option-item">
            <input type="radio" name="age" id="age4" value="36-45岁" />
            <label class="option-label" for="age4">36-45岁</label>
          </div>
          <div class="option-item">
            <input type="radio" name="age" id="age5" value="46-55岁" />
            <label class="option-label" for="age5">46-55岁</label>
          </div>
          <div class="option-item">
            <input type="radio" name="age" id="age6" value="56岁以上" />
            <label class="option-label" for="age6">56岁以上</label>
          </div>
        </div>
        <div class="error-msg" id="ageError">请选择年龄段</div>
      </div>

      <!-- 联系电话 -->
      <div class="form-group">
        <label class="form-label" for="phone">
          联系电话 <span class="required-mark">*</span>
        </label>
        <input type="tel" id="phone" class="form-input"
               placeholder="请输入手机号码" maxlength="11" />
        <div class="error-msg" id="phoneError">请填写正确的手机号码</div>
      </div>

      <!-- 主要困扰 -->
      <div class="form-group">
        <label class="form-label" for="concern">
          主要困扰 <span class="optional-mark">（选填）</span>
        </label>
        <textarea id="concern" class="form-input form-textarea"
                  placeholder="简单描述您目前面临的困扰或希望探索的议题，有助于咨询师提前做好准备（此内容严格保密）"
                  maxlength="300"></textarea>
      </div>

    </div>

    <!-- Submit -->
    <button type="submit" class="submit-btn" id="submitBtn">
      确认提交预约
    </button>

  </form>

  <div class="footer">
    本系统采用加密传输，所有信息严格保密<br/>
    如有疑问请联系咨询师
  </div>

</div>

<!-- Success Modal -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <span class="modal-icon">✅</span>
    <h2>预约成功！</h2>
    <p>您的预约信息已提交，咨询师将尽快与您联系确认。</p>
    <div class="modal-detail" id="modalDetail"></div>
    <p style="font-size:13px;color:#999">请保持手机畅通，等待咨询师确认</p>
    <button class="modal-btn" onclick="closeModal()">好的，我知道了</button>
  </div>
</div>

<script>
  // ===== 时间表格生成 =====
  const DAYS = ['周二', '周三', '周四', '周五', '周六', '周日'];
  const TIME_SLOTS = [
    '09:00-11:00',
    '11:00-13:00',
    '13:00-15:00',
    '15:00-17:00',
    '17:00-19:00',
    '19:00-20:00'  // 最后一段缩短至20点
  ];

  // 模拟已预约的时间段（实际使用时由后端返回）
  const BOOKED_SLOTS = new Set([
    '周二_09:00-11:00',
    '周四_13:00-15:00',
    '周六_15:00-17:00'
  ]);

  let selectedSlot = null;

  function buildSchedule() {
    const grid = document.getElementById('scheduleGrid');

    // 表头：空格 + 周几
    const emptyHeader = document.createElement('div');
    emptyHeader.className = 'schedule-header';
    emptyHeader.style.background = 'transparent';
    grid.appendChild(emptyHeader);

    DAYS.forEach(day => {
      const th = document.createElement('div');
      th.className = 'schedule-header';
      th.textContent = day;
      grid.appendChild(th);
    });

    // 时间行
    TIME_SLOTS.forEach(slot => {
      // 时间标签
      const label = document.createElement('div');
      label.className = 'time-label';
      label.textContent = slot;
      grid.appendChild(label);

      // 每个星期几
      DAYS.forEach(day => {
        const key = `${day}_${slot}`;
        const cell = document.createElement('div');
        cell.className = 'time-slot' + (BOOKED_SLOTS.has(key) ? ' booked' : '');
        cell.dataset.key = key;
        cell.dataset.day = day;
        cell.dataset.slot = slot;
        cell.textContent = BOOKED_SLOTS.has(key) ? '已约' : '可约';

        if (!BOOKED_SLOTS.has(key)) {
          cell.addEventListener('click', () => selectSlot(cell, day, slot));
        }
        grid.appendChild(cell);
      });
    });
  }

  function selectSlot(el, day, slot) {
    // 取消上一个选择
    document.querySelectorAll('.time-slot.selected').forEach(s => {
      s.classList.remove('selected');
      s.textContent = '可约';
    });

    el.classList.add('selected');
    el.textContent = '✓';
    selectedSlot = { day, slot, key: `${day}_${slot}` };

    const display = document.getElementById('selectedTimeDisplay');
    display.classList.remove('empty');
    display.innerHTML = `📅 已选择：<strong>${day} ${slot}</strong>`;

    document.getElementById('timeError').classList.remove('show');
  }

  // ===== 表单验证 =====
  function validate() {
    let valid = true;

    // 时间
    if (!selectedSlot) {
      document.getElementById('timeError').classList.add('show');
      valid = false;
    }

    // 昵称
    const nickname = document.getElementById('nickname').value.trim();
    if (!nickname) {
      document.getElementById('nicknameError').classList.add('show');
      document.getElementById('nickname').classList.add('error');
      valid = false;
    } else {
      document.getElementById('nicknameError').classList.remove('show');
      document.getElementById('nickname').classList.remove('error');
    }

    // 性别
    const gender = document.querySelector('input[name="gender"]:checked');
    if (!gender) {
      document.getElementById('genderError').classList.add('show');
      valid = false;
    } else {
      document.getElementById('genderError').classList.remove('show');
    }

    // 年龄段
    const age = document.querySelector('input[name="age"]:checked');
    if (!age) {
      document.getElementById('ageError').classList.add('show');
      valid = false;
    } else {
      document.getElementById('ageError').classList.remove('show');
    }

    // 手机号
    const phone = document.getElementById('phone').value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) {
      document.getElementById('phoneError').classList.add('show');
      document.getElementById('phone').classList.add('error');
      valid = false;
    } else {
      document.getElementById('phoneError').classList.remove('show');
      document.getElementById('phone').classList.remove('error');
    }

    return valid;
  }

  // ===== 表单提交 =====
  document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!validate()) {
      // 滚动到第一个错误
      const firstError = document.querySelector('.error-msg.show');
      if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '提交中...';

    const data = {
      预约时间: `${selectedSlot.day} ${selectedSlot.slot}`,
      昵称: document.getElementById('nickname').value.trim(),
      性别: document.querySelector('input[name="gender"]:checked').value,
      年龄段: document.querySelector('input[name="age"]:checked').value,
      联系电话: document.getElementById('phone').value.trim(),
      主要困扰: document.getElementById('concern').value.trim() || '（未填写）',
      提交时间: new Date().toLocaleString('zh-CN')
    };

    // ——— 数据存储到本地（离线可用）———
    saveToLocal(data);

    // ——— 可选：发送到 Formspree（填写您的 formspree endpoint）———
    // await sendToFormspree(data);

    // 显示成功弹窗
    showSuccess(data);

    btn.disabled = false;
    btn.textContent = '确认提交预约';
  });

  function saveToLocal(data) {
    const existing = JSON.parse(localStorage.getItem('appointments') || '[]');
    existing.push(data);
    localStorage.setItem('appointments', JSON.stringify(existing));
  }

  // Formspree 发送函数（启用时取消注释，并填入您的 endpoint）
  /*
  async function sendToFormspree(data) {
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID';
    try {
      await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      });
    } catch(err) {
      console.error('发送失败', err);
    }
  }
  */

  function showSuccess(data) {
    const detail = document.getElementById('modalDetail');
    detail.innerHTML = Object.entries(data)
      .map(([k, v]) => `<span style="color:#718096">${k}：</span><strong>${v}</strong>`)
      .join('<br/>');
    document.getElementById('successModal').classList.add('show');

    // 标记该时间段为已预约
    const cell = document.querySelector(`.time-slot[data-key="${selectedSlot.key}"]`);
    if (cell) {
      cell.classList.remove('selected');
      cell.classList.add('booked');
      cell.textContent = '已约';
    }
    selectedSlot = null;
    document.getElementById('selectedTimeDisplay').innerHTML = '📅 请在上方表格中点击选择您希望预约的时间';
    document.getElementById('selectedTimeDisplay').classList.add('empty');
    document.getElementById('appointmentForm').reset();
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('show');
  }

  // 初始化表格
  buildSchedule();
</script>

</body>
</html>
