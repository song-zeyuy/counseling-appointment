<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约二维码 - 心理咨询</title>
  <style>
    :root {
      --primary: #6C8EBF;
      --primary-dark: #4A6FA5;
      --primary-light: #E8F0FB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #E8F0FB 0%, #F0F4FA 50%, #EAF3EE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(108,142,191,0.18);
      padding: 40px 36px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .icon { font-size: 48px; margin-bottom: 12px; }

    h1 {
      font-size: 22px;
      color: var(--primary-dark);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 28px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 280px;
      align-items: center;
    }

    #qrcode img {
      border-radius: 12px;
      border: 6px solid var(--primary-light);
      box-shadow: 0 4px 20px rgba(108,142,191,0.2);
      width: 260px;
      height: 260px;
    }

    .loading {
      color: var(--primary);
      font-size: 14px;
      padding: 40px;
    }

    .url-box {
      background: var(--primary-light);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--primary-dark);
      word-break: break-all;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .url-box strong { display: block; margin-bottom: 4px; color: #4A6FA5; }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border-radius: 24px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 3px 12px rgba(108,142,191,0.35);
    }

    .btn-outline {
      background: white;
      color: var(--primary-dark);
      border: 1.5px solid var(--primary);
    }

    .btn:hover { transform: translateY(-1px); }

    .tip {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.7;
    }

    .local-note {
      margin-top: 16px;
      background: #FFF9EC;
      border: 1px solid #F5D78E;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #7A5C1E;
      line-height: 1.7;
      text-align: left;
    }

    .local-note strong { display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🌿</div>
  <h1>心理咨询预约</h1>
  <p class="subtitle">扫描下方二维码，快速预约咨询时间</p>

  <div id="qrcode"><div class="loading">正在生成二维码…</div></div>

  <div class="url-box">
    <strong>预约链接：</strong>
    <span id="urlText">https://counseling-appointment.vercel.app</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadQR()">💾 下载二维码</button>
    <button class="btn btn-outline" onclick="copyUrl()">📋 复制链接</button>
  </div>

  <div class="local-note">
    <strong>📌 使用说明</strong>
    下载二维码后，可打印贴在咨询室门口，或通过微信发送给来访者。扫码即可直接填写预约表单。
  </div>

  <p class="tip">
    二维码可截图后通过微信、海报等方式分享给来访者<br/>
    建议打印并张贴于咨询室门口或等候区
  </p>
</div>

<script>
  const appointmentUrl = encodeURIComponent('https://counseling-appointment.vercel.app/index.html');
  const qrUrl = 'https://chart.googleapis.com/chart?chs=300x300&cht=qr&chl=' + appointmentUrl + '&choe=UTF-8&chld=L|1';

  document.getElementById('urlText').textContent = 'https://counseling-appointment.vercel.app/index.html';

  var img = new Image();
  img.crossOrigin = 'Anonymous';
  img.onload = function() {
    document.getElementById('qrcode').innerHTML = '';
    img.style.cssText = 'border-radius:12px;border:6px solid #E8F0FB;box-shadow:0 4px 20px rgba(108,142,191,0.2);width:260px;height:260px';
    document.getElementById('qrcode').appendChild(img);
  };
  img.onerror = function() {
    document.getElementById('qrcode').innerHTML = '<p style="color:#C96B6B;font-size:13px;padding:20px">二维码加载失败，请检查网络后刷新重试</p>';
  };
  img.src = qrUrl;

  function downloadQR() {
    var canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 440;
    var ctx = canvas.getContext('2d');

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, 400, 440);

    var qrImg = new Image();
    qrImg.crossOrigin = 'Anonymous';
    qrImg.onload = function() {
      ctx.drawImage(qrImg, 40, 20, 320, 320);
      ctx.fillStyle = '#4A6FA5';
      ctx.font = 'bold 18px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('扫码预约心理咨询', 200, 385);
      ctx.font = '13px Arial, sans-serif';
      ctx.fillStyle = '#718096';
      ctx.fillText('心理咨询预约系统', 200, 410);

      var link = document.createElement('a');
      link.download = '心理咨询预约二维码.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };
    qrImg.onerror = function() {
      alert('图片尚未加载完成，请稍候再试');
    };
    qrImg.src = qrUrl;
  }

  function copyUrl() {
    var url = document.getElementById('urlText').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function() { alert('链接已复制到剪贴板！'); });
    } else {
      var el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('链接已复制！');
    }
  }
</script>
</body>
</html>
