<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预约二维码 - 心理咨询</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #6C8EBF;
      --primary-dark: #4A6FA5;
      --primary-light: #E8F0FB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #E8F0FB 0%, #F0F4FA 50%, #EAF3EE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(108,142,191,0.18);
      padding: 40px 36px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .icon { font-size: 48px; margin-bottom: 12px; }

    h1 {
      font-size: 22px;
      color: var(--primary-dark);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 28px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    #qrcode canvas, #qrcode img {
      border-radius: 12px;
      border: 6px solid var(--primary-light);
      box-shadow: 0 4px 20px rgba(108,142,191,0.2);
    }

    .url-box {
      background: var(--primary-light);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--primary-dark);
      word-break: break-all;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .url-box strong { display: block; margin-bottom: 4px; color: #4A6FA5; }

    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 11px 22px;
      border-radius: 24px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 3px 12px rgba(108,142,191,0.35);
    }

    .btn-outline {
      background: white;
      color: var(--primary-dark);
      border: 1.5px solid var(--primary);
    }

    .btn:hover { transform: translateY(-1px); }

    .tip {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.7;
    }

    .local-note {
      margin-top: 16px;
      background: #FFF9EC;
      border: 1px solid #F5D78E;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #7A5C1E;
      line-height: 1.7;
      text-align: left;
    }

    .local-note strong { display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🌿</div>
  <h1>心理咨询预约</h1>
  <p class="subtitle">扫描下方二维码，快速预约咨询时间</p>

  <div id="qrcode"></div>

  <div class="url-box" id="urlBox">
    <strong>预约链接：</strong>
    <span id="urlText">正在生成…</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadQR()">💾 下载二维码</button>
    <button class="btn btn-outline" onclick="copyUrl()">📋 复制链接</button>
  </div>

  <div class="local-note">
    <strong>⚠️ 关于二维码的使用说明</strong>
    当前生成的是本地文件路径的二维码，仅适用于同一设备。<br/>
    若需要来访者用手机扫码填写，需将 <strong>index.html</strong> 部署到互联网（如 EdgeOne Pages、Vercel 等免费托管服务），然后用在线 URL 重新生成二维码。
  </div>

  <p class="tip">
    二维码可截图后通过微信、海报等方式分享给来访者<br/>
    建议打印并张贴于咨询室门口或等候区
  </p>
</div>

<script>
  // 获取当前页面的预约表单 URL
  const currentUrl = location.href;
  const appointmentUrl = currentUrl.replace('qrcode.html', 'index.html');

  document.getElementById('urlText').textContent = appointmentUrl;

  // 生成二维码
  QRCode.toCanvas(
    document.createElement('canvas'),
    appointmentUrl,
    { width: 240, margin: 2, color: { dark: '#4A6FA5', light: '#FFFFFF' } },
    function(err, canvas) {
      if (err) {
        console.error(err);
        document.getElementById('qrcode').innerHTML = '<p style="color:red">二维码生成失败，请检查网络连接</p>';
        return;
      }
      document.getElementById('qrcode').appendChild(canvas);
    }
  );

  function downloadQR() {
    const canvas = document.querySelector('#qrcode canvas');
    if (!canvas) { alert('二维码尚未生成，请稍候'); return; }

    // 创建带白边的大图
    const size = 320;
    const padding = 20;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = size + padding * 2;
    offCanvas.height = size + padding * 2 + 60;
    const ctx = offCanvas.getContext('2d');

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, offCanvas.width, offCanvas.height);

    ctx.drawImage(canvas, padding, padding, size, size);

    ctx.fillStyle = '#4A6FA5';
    ctx.font = 'bold 16px PingFang SC, Microsoft YaHei, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('扫码预约心理咨询', offCanvas.width / 2, size + padding * 2 + 30);

    const link = document.createElement('a');
    link.download = '心理咨询预约二维码.png';
    link.href = offCanvas.toDataURL('image/png');
    link.click();
  }

  function copyUrl() {
    const url = document.getElementById('urlText').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => alert('链接已复制到剪贴板'));
    } else {
      const el = document.createElement('textarea');
      el.value = url;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('链接已复制');
    }
  }
</script>
</body>
</html>
